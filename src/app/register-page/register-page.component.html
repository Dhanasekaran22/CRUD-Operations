<div class="container">
    <h2>Register User</h2>
    <form (ngSubmit)="addUsers()">
      <label for="username">Username</label>
      <input [(ngModel)]="user.username" name="username" type="text" required />
  
      <label for="email">Email</label>
      <input [(ngModel)]="user.email" name="email" type="email" required />
  
      <label for="password">Password</label>
      <input [(ngModel)]="user.password" name="password" type="password" required />
  
      <button type="submit">Register</button>
    </form>
  </div>
