<div class="container">
    <h2>Registered Users</h2>
    <table>
      <thead>
        <tr>
          <th>Username</th>
          <th>Email</th>
          <th>Password</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td>{{ user.username }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.password }}</td>
          <td>
            <button (click)="startEdit(user)">Edit</button>
            <button (click)="deleteUser(user._id, user._rev)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  
    <!-- Edit Form as Modal -->
    <div *ngIf="isEditing" class="modal" [ngClass]="{ 'show': isEditing }">
      <div class="edit-form">
        <h3>Edit User</h3>
        <form (ngSubmit)="updateUser()">
          <label for="username">Username</label>
          <input [(ngModel)]="editUserData.username" name="username" type="text" required />
  
          <label for="email">Email</label>
          <input [(ngModel)]="editUserData.email" name="email" type="email" required />
  
          <label for="password">Password</label>
          <input [(ngModel)]="editUserData.password" name="password" type="password" required />
  
          <div class="center">
          <button type="submit">Update</button>
          <button type="button" (click)="cancelEdit()">Cancel</button>
        </div>
        </form>
      </div>
    </div>
  </div>
