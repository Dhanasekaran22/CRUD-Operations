<div class="container">
  <h2>Registered Users</h2>
  
  <div id="grid-container" style="width:100%; height:500px;">
    <angular-slickgrid 
      gridId="usersGrid"
      [columnDefinitions]="columnDefinitions"
      [gridOptions]="gridOptions"
      [dataset]="dataset"
      (onAngularGridCreated)="onAngularGridCreated($event)" *ngIf="dataset.length">
    </angular-slickgrid>
    
  </div>
</div>

<!-- Edit User Modal -->
<div [ngClass]="{ 'modal': true, 'show': isEditing }">
  <div class="edit-form">
    <h3>Edit User</h3>
    <form (ngSubmit)="updateUser()">
      <label for="username">Username</label>
      <input [(ngModel)]="editUserData.username" name="editUsername" type="text" required />

      <label for="email">Email</label>
      <input [(ngModel)]="editUserData.email" name="editEmail" type="email" required />

      <label for="password">Password</label>
      <input [(ngModel)]="editUserData.password" name="editPassword" type="password" required />

      <div style="display: flex; justify-content: space-between;">
        <button type="submit">Update</button>
        <button type="button" (click)="cancelEdit()">Cancel</button>
      </div>
    </form>
  </div>
</div>
