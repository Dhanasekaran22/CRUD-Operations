<div class="container">
  <h2>Registered Users</h2>

  <!-- Angular SlickGrid Component -->
    <angular-slickgrid
    gridId="usersGrid"
    [columnDefinitions]="columnDefinitions"
    [gridOptions]="gridOptions"
    [dataset]="users"
    (onAngularGridCreated)="gridReady($any($event))">
  </angular-slickgrid>


  <!-- Edit Form Modal -->
  <div *ngIf="isEditing" class="modal show">
    <div class="edit-form">
      <h3>Edit User</h3>
      <form (ngSubmit)="updateUser()">
        <label for="username">Username</label>
        <input [(ngModel)]="editUserData.username" name="username" type="text" required />

        <label for="email">Email</label>
        <input [(ngModel)]="editUserData.email" name="email" type="email" required />

        <label for="password">Password</label>
        <input [(ngModel)]="editUserData.password" name="password" type="password" required />

        <div class="center">
          <button type="submit">Update</button>
          <button type="button" (click)="cancelEdit()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
