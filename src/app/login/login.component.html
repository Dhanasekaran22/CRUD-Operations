<div class="login">
    <h2>Login</h2>
  
    <form >
      <div>
        <label for="email">Email</label>
        <input id="email" [(ngModel)]="login.email" name="email" type="email" required />
      </div>
  
      <div>
        <label for="password">Password</label>
        <input id="password" [(ngModel)]="login.password" name="password" type="password" required />
      </div>
  
      <button type="submit">Login</button>
    </form>
  </div>
